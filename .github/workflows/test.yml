name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find . -name '*.php' -not -path './legacy/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: node tests/runtime.js
      - run: node tests/http.js
